name: AI_Smart_Booking_Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: my-deployment
        uses: actions/checkout@v4
      - name: connection
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{secrets.IP}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}

          script: |
            cd /home/ubuntu/6weeks_Mamta_PYTHON
            git pull origin main
            sudo npm i
            sudo npm run build
            pm2 restart "python-frontend" || pm2 start npm --name "python-frontend" -- run dev
